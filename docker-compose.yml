version: "3.9"

services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
    networks:
      - ridex-net

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8000"
    networks:
      - ridex-net

networks:
  ridex-net:
    driver: bridge